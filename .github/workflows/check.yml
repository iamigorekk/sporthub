name: API surface

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check client examples
        run: |
          python -m py_compile examples/python.py
          node --check examples/javascript.mjs
          sh -n examples/curl.sh
      - name: Check API contract and repository boundary
        run: |
          grep -q '^openapi: 3.1.0$' openapi.yaml
          grep -q 'https://sporthub.sh/api' openapi.yaml
          test ! -d backend
          test ! -d deploy
          test ! -f .env
